<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Serviços realizados — MJL</title>
<meta name="theme-color" content="#1a4f7a">
<meta name="robots" content="noindex">
<style>
:root{--brand:#1a4f7a;--brand2:#12395a;--green:#1e7e4a;--bg:#eef2f6;--card:#fff;--txt:#22313f;--txt2:#5a6a7a;--txt3:#8a9aaa;--bd:#e2e9f0;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;line-height:1.5;}
.wrap{max-width:640px;margin:0 auto;padding:0 0 40px;}
.hero{background:linear-gradient(150deg,var(--brand) 0%,var(--brand2) 100%);color:#fff;padding:26px 20px 22px;}
.hero-top{display:flex;align-items:center;gap:12px;padding-bottom:16px;border-bottom:1px solid rgba(255,255,255,.22);}
.hero-top img{height:42px;object-fit:contain;filter:brightness(0) invert(1);}
.emp{font-size:16px;font-weight:700;}
.slogan{font-size:9.5px;letter-spacing:1.4px;opacity:.78;margin-top:2px;}
.kicker{font-size:10.5px;letter-spacing:2.2px;opacity:.75;margin:18px 0 7px;}
h1{font-size:24px;margin:0;font-weight:700;line-height:1.2;}
.area-chip{display:inline-block;margin-top:11px;background:var(--green);font-size:12px;font-weight:700;letter-spacing:1px;padding:5px 14px;border-radius:20px;}
.att{font-size:10.5px;opacity:.7;margin-top:14px;}
.pad{padding:16px;}
.resumo{display:flex;gap:9px;margin-bottom:14px;}
.kpi{flex:1;background:var(--card);border:1px solid var(--bd);border-left:3px solid var(--brand);border-radius:10px;padding:12px 13px;}
.kpi b{display:block;font-size:22px;color:var(--brand);line-height:1;}
.kpi span{font-size:10px;color:var(--txt3);text-transform:uppercase;letter-spacing:.4px;display:block;margin-top:5px;}
.dia{margin-bottom:14px;}
.dia-h{font-size:12px;font-weight:800;color:var(--brand);text-transform:uppercase;letter-spacing:.7px;margin:0 0 7px 3px;display:flex;align-items:baseline;gap:6px;}
.dia-h em{font-style:normal;font-weight:400;color:var(--txt3);text-transform:none;letter-spacing:0;}
.item{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:13px 14px;margin-bottom:8px;}
.item-top{display:flex;gap:9px;align-items:flex-start;}
.check{width:21px;height:21px;border-radius:50%;background:var(--green);color:#fff;font-size:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px;}
.tf{font-size:14.5px;font-weight:600;flex:1;min-width:0;}
.meta{font-size:11.5px;color:var(--txt3);margin-top:2px;}
.meta .ar{color:var(--brand);font-weight:600;}
.obs{font-size:12px;color:#7a5c14;background:#fff8e1;border:1px solid #f3e2b0;border-radius:8px;padding:7px 10px;margin-top:9px;}
.fotos{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;}
.fotos img{width:76px;height:76px;object-fit:cover;border-radius:8px;border:1px solid var(--bd);background:#f4f7fa;cursor:zoom-in;}
.vazio,.erro{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:30px 22px;text-align:center;color:var(--txt2);}
.vazio .ic{font-size:40px;margin-bottom:10px;}
.rod{text-align:center;font-size:10.5px;color:var(--txt3);padding:22px 20px 0;line-height:1.7;}
.rod b{color:var(--txt2);}
.load{text-align:center;padding:44px 20px;color:var(--txt3);font-size:13px;}
.spin{width:26px;height:26px;border:3px solid var(--bd);border-top-color:var(--brand);border-radius:50%;margin:0 auto 12px;animation:g .8s linear infinite;}
@keyframes g{to{transform:rotate(360deg)}}
.lb{position:fixed;inset:0;background:rgba(10,20,30,.93);display:none;align-items:center;justify-content:center;z-index:99;padding:16px;}
.lb img{max-width:100%;max-height:88vh;border-radius:10px;}
.lb.on{display:flex;}
.btn{display:block;width:100%;background:var(--brand);color:#fff;border:0;border-radius:10px;padding:13px;font-size:14px;font-weight:700;margin-top:12px;cursor:pointer;font-family:inherit;}
</style>
</head>

<script>
// ===================================================================
// COLE AQUI a URL do "MJL Público (QR)" — a que termina em /exec
// (é a do Apps Script PÚBLICO, NÃO a do App Campo/Gestão)
var API = 'https://script.google.com/macros/s/AKfycbxesMFYJrYPCsoka99PwLahvvxbD4qPlfXcdXKj1mcX5cenls8qHu-SM7fhJIUMGPgmGA/exec';
// ===================================================================

var MESES=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
var DIAS=['domingo','segunda-feira','terça-feira','quarta-feira','quinta-feira','sexta-feira','sábado'];
function esc(t){return String(t==null?'':t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function par(n){var m=new RegExp('[?&]'+n+'=([^&]*)').exec(location.search);return m?decodeURIComponent(m[1].replace(/\+/g,' ')):'';}
function thumb(id,sz){return 'https://drive.google.com/thumbnail?id='+encodeURIComponent(id)+'&sz=w'+sz;}
function abrirFoto(id){document.getElementById('lbimg').src=thumb(id,1600);document.getElementById('lb').classList.add('on');}

var CLI=par('c'), AREA=par('a');

function erro(msg,detalhe){
  document.getElementById('tit').textContent=CLI||'Serviços da MJL';
  document.getElementById('saida').innerHTML='<div class="erro"><div style="font-size:38px;margin-bottom:10px;">📶</div><strong>'+esc(msg)+'</strong>'+
    (detalhe?'<div style="font-size:12px;color:var(--txt3);margin-top:8px;">'+esc(detalhe)+'</div>':'')+
    '<button class="btn" onclick="location.reload()">Tentar de novo</button></div>';
}

function render(d){
  document.getElementById('tit').textContent=d.cliente||CLI;
  document.getElementById('chip').innerHTML=d.area?'<span class="area-chip">📍 '+esc(d.area).toUpperCase()+'</span>':'';
  document.getElementById('att').textContent='Atualizado em '+d.atualizadoEm;
  var el=document.getElementById('saida');
  if(!d.itens||!d.itens.length){
    el.innerHTML='<div class="vazio"><div class="ic">📋</div><strong>Nenhum serviço registrado nos últimos '+d.dias+' dias'+(d.area?' nesta área':'')+'.</strong>'+
      '<div style="font-size:12.5px;margin-top:9px;">Assim que a equipe concluir uma tarefa aqui, ela aparece nesta página.</div></div>';
    return;
  }
  var comFoto=0, porDia={}, ordem=[];
  d.itens.forEach(function(x){
    if(x.fotos&&x.fotos.length) comFoto++;
    if(!porDia[x.data]){porDia[x.data]=[];ordem.push(x.data);}
    porDia[x.data].push(x);
  });
  var h='<div class="resumo">'+
    '<div class="kpi"><b>'+d.itens.length+'</b><span>serviços em '+d.dias+' dias</span></div>'+
    '<div class="kpi"><b>'+ordem.length+'</b><span>dias com atendimento</span></div>'+
    (comFoto?'<div class="kpi"><b>'+comFoto+'</b><span>com foto</span></div>':'')+
    '</div>';
  var hojeStr=new Date().toISOString().slice(0,10);
  var ontem=new Date(Date.now()-86400000).toISOString().slice(0,10);
  ordem.forEach(function(data){
    var p=data.split('-'), dt=new Date(+p[0],+p[1]-1,+p[2]);
    var rot = data===hojeStr ? 'Hoje' : (data===ontem ? 'Ontem' : DIAS[dt.getDay()]);
    h+='<div class="dia"><div class="dia-h">'+esc(rot)+' <em>· '+p[2]+' de '+MESES[+p[1]-1]+'</em></div>';
    porDia[data].forEach(function(x){
      h+='<div class="item"><div class="item-top"><div class="check">✓</div><div class="tf">'+esc(x.tarefa||'Serviço realizado')+
         '<div class="meta">'+(x.hora?'às '+esc(x.hora):'')+(x.area&&!d.area?' · <span class="ar">📍 '+esc(x.area)+'</span>':'')+'</div></div></div>';
      if(x.obs) h+='<div class="obs">📝 '+esc(x.obs)+'</div>';
      if(x.fotos&&x.fotos.length){
        h+='<div class="fotos">'+x.fotos.map(function(f){
          return '<img loading="lazy" src="'+thumb(f,300)+'" onclick="abrirFoto(\''+esc(f)+'\')" alt="Foto do serviço">';
        }).join('')+'</div>';
      }
      h+='</div>';
    });
    h+='</div>';
  });
  el.innerHTML=h;
}

(function(){
  if(!CLI){ erro('Link incompleto','Este QR não trouxe o nome do condomínio. Avise a administração.'); return; }
  document.getElementById('tit').textContent=CLI;
  if(AREA) document.getElementById('chip').innerHTML='<span class="area-chip">📍 '+esc(AREA).toUpperCase()+'</span>';
  if(!API||API.indexOf('http')!==0){ erro('Página ainda não configurada','Falta ligar a página ao sistema da MJL.'); return; }
  // O navegador bloqueia por CORS a leitura direta do Apps Script a partir
  // deste endereço, então buscamos por JSONP: a resposta chega como script.
  var base=API+(API.indexOf('?')>=0?'&':'?')+'acao=publico&c='+encodeURIComponent(CLI)+(AREA?'&a='+encodeURIComponent(AREA):'');
  var fn='mjlQR'+Date.now();
  var respondeu=false;
  window[fn]=function(d){
    respondeu=true;
    try{ delete window[fn]; }catch(e){ window[fn]=undefined; }
    if(!d||!d.ok){ erro('Não foi possível carregar', d&&d.erro?d.erro:''); return; }
    render(d);
  };
  var tag=document.createElement('script');
  tag.src=base+'&callback='+fn;
  tag.onerror=function(){ if(!respondeu) erro('Não foi possível carregar','A página não conseguiu falar com o sistema da MJL. Tente de novo em alguns instantes.'); };
  document.head.appendChild(tag);
  setTimeout(function(){ if(!respondeu) erro('Sem resposta','Verifique a internet e toque em Tentar de novo.'); },20000);
})();
</script>
